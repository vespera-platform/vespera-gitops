apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vespera-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/vespera-platform/vespera.git
      path: charts/vespera
      targetRevision: main
      helm:
        valueFiles:
          - $values/envs/dev/values.yaml
    - repoURL: https://github.com/vespera-platform/vespera-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vespera-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true