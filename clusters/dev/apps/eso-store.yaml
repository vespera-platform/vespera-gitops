apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/vespera-platform/vespera-gitops.git
    path: eso-local
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: eso-local
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
