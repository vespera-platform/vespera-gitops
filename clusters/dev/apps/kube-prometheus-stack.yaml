apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.13.1
      helm:
        valuesObject:
          grafana:
            enabled: true
            additionalDataSources:
              - name: Loki
                type: loki
                uid: loki
                url: http://loki.monitoring.svc:3100
          prometheus:
            prometheusSpec:
              retention: 2d
              podMonitorSelectorNilUsesHelmValues: false
              ruleSelectorNilUsesHelmValues: false
          alertmanager:
            enabled: true
            config:
              route:
                receiver: vespera-sim
                group_by: ['alertname']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 1h
              receivers:
                - name: 'null'
                - name: vespera-sim
                  webhook_configs:
                    - url: http://target-sim.vespera-dev.svc:8000/hook
                      send_resolved: true
          nodeExporter:
            enabled: false
          kubeStateMetrics:
            enabled: false
          defaultRules:
            create: false
          kubelet:
            enabled: false
          kubeApiServer:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeEtcd:
            enabled: false
          kubeProxy:
            enabled: false
          coreDns:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

