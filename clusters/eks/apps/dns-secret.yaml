apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/vespera-platform/vespera-gitops.git
    path: eks-dns
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
