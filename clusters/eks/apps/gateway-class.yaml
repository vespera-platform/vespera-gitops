apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-class
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/vespera-platform/vespera-gitops.git
    path: eks-gateway
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
