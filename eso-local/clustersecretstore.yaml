apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: eso-local
spec:
  provider:
    kubernetes:
        remoteNamespace: eso-local
        server:
          url: https://kubernetes.default.svc
          caProvider:
            type: ConfigMap
            name: kube-root-ca.crt
            key: ca.crt
            namespace: eso-local
        auth:
          ServiceAccount:
            name: eso-store
            namespace: eso-local